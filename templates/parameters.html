    <!-- PJ6021: Early auth check - redirect immediately if not logged in -->
    <script>
        // Check auth BEFORE page renders - prevents flash of content
        (async function earlyAuthCheck() {
            try {
                const response = await fetch('/api/auth/session', {credentials: 'include'});
                if (response.status === 401 || !response.ok) {
                    // Not authenticated - redirect to login IMMEDIATELY
                    console.log('[DIARY] Not authenticated, redirecting to login');
                    window.location.replace('/');
                    // Stop page from rendering
                    document.documentElement.innerHTML = '';
                    return;
                }
            } catch (error) {
                console.error('[DIARY] Auth check failed:', error);
                window.location.replace('/');
                document.documentElement.innerHTML = '';
            }
        })();
    </script>

            /* A27 SCROLL FIX: `clip`, not `hidden`. Per the CSS Overflow spec, setting
               one axis to `hidden` forces the other axis' `visible` to compute to `auto`,
               turning these wrappers into scroll containers that swallow vertical swipes
               and freeze the page. `clip` suppresses horizontal overflow without creating
               a scroll container. (`overflow-x: hidden` on <body> is safe and is left

            .parameters-page, .calendar-container, .diary-card,

        /* Presentation-only; supports the viewport-fit=cover meta added above. */
        /* ================================================================== */
        /* (1) Stop iOS from auto-inflating text sizes in landscape. */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        /* (2) Remove the grey tap-flash + (3) kill the 300ms tap delay on
              interactive elements for snappier, native-feeling taps. */
        a, button, .btn, [onclick], [role="button"],

const _originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, value) {
    // Only intercept language-related keys
    if (key === 'selectedLanguage' || key === 'userLanguage') {
        const oldValue = localStorage.getItem(key);

        // Block non-en → en changes UNLESS user interacted with selector recently
        const timeSinceClick = Date.now() - (window._lastLanguageSelectorInteraction || 0);
        const isRecentUserAction = timeSinceClick < 10000;
        if (oldValue && oldValue !== 'en' && value === 'en' && !isRecentUserAction) {

        }
    }

            card.setAttribute('aria-label', pick(STR.aria, L));

            var glow = document.createElement('div'); glow.id = 'ts-gift-glow';

            var title = document.createElement('p');
            title.id = 'ts-gift-title'; title.textContent = pick(STR.title, L);

            var emoji = document.createElement('div');
            emoji.id = 'ts-gift-emoji'; emoji.textContent = '🎁';
            emoji.setAttribute('role', 'button'); emoji.setAttribute('tabindex', '0');
            emoji.setAttribute('aria-label', pick(STR.revealTitle, L));
            if (!reduce()) emoji.classList.add('ts-gift-idle');

            var hint = document.createElement('p');
            hint.id = 'ts-gift-hint'; hint.textContent = pick(STR.hint, L);

            var reveal = document.createElement('div');
            reveal.id = 'ts-gift-reveal';
            var rTitle = document.createElement('p');
            rTitle.id = 'ts-gift-reveal-title'; rTitle.textContent = pick(STR.revealTitle, L);
            // A16: POINTS are the main reward — large, above the reflection sentence.
            var baseP  = (gift && typeof gift.base_points === 'number') ? gift.base_points : 15;
            var bonusP = (gift && typeof gift.bonus === 'number') ? gift.bonus : 0;
            // Prefer the server's authoritative total; if absent, derive it from base+bonus so
            // the headline can never disagree with the breakdown line below it.
            var earned = (gift && typeof gift.points === 'number') ? gift.points : (baseP + bonusP);
            var pointsMain = document.createElement('div');
            pointsMain.id = 'ts-gift-points';
            pointsMain.textContent = '+' + earned + ' ' + pick(STR.points, L);
            var pointsBreak = document.createElement('p');
            pointsBreak.id = 'ts-gift-points-break';
            if (bonusP > 0) {
                pointsBreak.textContent = '+' + baseP + ' ' + pick(STR.checkinReward, L) +
                                          '  ·  +' + bonusP + ' ' + pick(STR.streakBonus, L) + ' 🔥';
            } else {
                pointsBreak.textContent = pick(STR.checkinReward, L);
            }

            pointsTotal.id = 'ts-gift-points-total';
            if (gift && typeof gift.total_points === 'number' && gift.total_points > 0) {
                pointsTotal.textContent = pick(STR.totalPoints, L).replace('{n}', gift.total_points);
            }
            // The reflection sentence stays, but now as a smaller pleasant addition below.
            var rText = document.createElement('p');

            // never renders the literal string "undefined". textContent = undefined → "undefined".

            reveal.appendChild(pointsMain);
            reveal.appendChild(pointsBreak);
            if (pointsTotal.textContent) reveal.appendChild(pointsTotal);

            var opened = false;
            var open = function () {

                // never blocks or affects the animation; failures are silently ignored.
                try {
                    fetch('/api/gift/opened', {
                        method: 'POST', credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ date: (gift && gift.date) || todayStr() })
                    }).catch(function () {});
                } catch (_) {}
                emoji.classList.remove('ts-gift-idle');
                if (!reduce()) { emoji.classList.add('ts-gift-pop'); glow.classList.add('burst'); }
                var swap = function () {
                    emoji.style.display = 'none';
                    hint.style.display = 'none';
                    reveal.classList.add('show');
                    try { closeBtn.focus(); } catch (_) {}
                };
                setTimeout(swap, reduce() ? 0 : 430);
            };
            emoji.addEventListener('click', open);
            emoji.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
            });

            card.appendChild(glow); card.appendChild(title); card.appendChild(emoji);
            card.appendChild(hint); card.appendChild(reveal);
            overlay.appendChild(card);

            // A27 FIX: backdrop click now closes ALWAYS, not only after the gift is opened.
            // Previously the only dismissal paths before opening were the Escape key (which
            // phones do not have) and tapping the gift itself. A user who did not realise
            // they had to tap the gift was left with a modal they could not dismiss AND
            // `overflow: hidden` on <body> - a fully frozen page.
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) close(overlay);
            });
            overlay.__esc = function (e) { if (e.key === 'Escape') close(overlay); };
            document.addEventListener('keydown', overlay.__esc);

            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';
            requestAnimationFrame(function () { overlay.classList.add('show'); });
        }

        function onReportSaved(dateStr) {
            try {
                var today = todayStr();
                // Only reward *today's* completion, and only once per page-view.
                if (dateStr && dateStr !== today) return;
                if (shownForDate === today) return;
                if (fetching) return;                          // A12-AUDIT: a rapid double-save
                if (document.getElementById('ts-gift-overlay')) return;

                fetching = true;
                var url = '/api/gift/daily?client_date=' + encodeURIComponent(today) +
                          '&lang=' + encodeURIComponent(lang());
                fetch(url, { credentials: 'include' })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        if (!data || !data.eligible || !data.gift) { fetching = false; return; }
                        shownForDate = today;   // latch: `fetching` stays true so nothing re-shows this view
                        // Let the save's success toast breathe before the box appears.
                        setTimeout(function () { render(data.gift); }, 650);
                    })
                    .catch(function () { fetching = false; });
            } catch (_) { fetching = false; }
        }

        window.TSGiftBox = { onReportSaved: onReportSaved };
    })();
    </script>
    <!-- ===================== END GIFT BOX (A12) ===================== -->

    <!-- A16-ANDROID: additive, non-invasive Android-safe CSS (item 1). Presentation-only;

    <!-- A27 FIX: scroll-lock safety net. Any code path that sets
         `document.body.style.overflow = 'hidden'` and fails to release it freezes the page
         permanently. This clears the lock whenever no blocking overlay is actually on
         screen, so a stuck lock can never outlive the thing that set it. -->
    <script id="ts-a27-scrolllock-net">
    (function () {
        function blockingOverlayVisible() {
            var els = document.querySelectorAll(
                '#diaryMoreMenu, #mobileMoreMenu, #ts-gift-overlay, #onboarding-overlay, ' +
                '#desktopPopup, #appload-splash, .modal'
            );
            for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (el.classList.contains('hidden')) continue;
                var st = getComputedStyle(el);
                if (st.display === 'none' || st.visibility === 'hidden') continue;
                if (parseFloat(st.opacity) === 0) continue;
                return true;
            }
            return false;
        }
        function releaseOrphanedLock() {
            if (document.body.style.overflow !== 'hidden') return;
            if (blockingOverlayVisible()) return;   // a real modal is open - leave it alone
            document.body.style.overflow = '';
        }
        setInterval(releaseOrphanedLock, 1500);
        window.addEventListener('pageshow', releaseOrphanedLock);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) releaseOrphanedLock();
        });
    })();
    </script>

    <!-- A41-UX: 10 additive, non-invasive mobile UX improvements (B185).              -->
    <!-- Self-contained: one style block + one guarded script, namespaced ts-a41-*.    -->
    <!-- Feature-detected & reduced-motion aware. Chosen to NOT overlap the existing    -->
    <!-- B30 / A8-UX / A16-ANDROID+UX / A26-POLISH blocks. No existing markup, IDs or   -->
    <!-- logic changed. Helps iOS Safari, Android Chrome, and other mobile engines.     -->
    <!--  1 Real autofill: autocomplete tokens on email/username/name/tel fields         -->
    <!--  2 Right mobile keyboard: inputmode on email/tel fields                          -->
    <!--  3 No accidental text-selection of buttons / nav labels on long-press           -->
    <!--  4 scroll-margin so focused fields & anchors don't hide under the sticky nav     -->
    <!--  5 Honest >=44px tap targets for form selects & buttons (nav lang box excluded) -->
    <!--  6 prefers-contrast: more — stronger borders + underlined links                 -->
    <!--  7 Tactile :active press feedback on nav / sidebar items (A8 covered buttons)    -->
    <!--  8 Brand-native form controls (accent-color) + cross-engine slim scrollbar       -->
    <!--  9 Stop horizontal rubber-band / side-swipe chaining + image overflow guard      -->
    <!-- 10 Crisper text (font-smoothing) + tabular-nums so counters don't jitter         -->
    <!-- ============================================================================ -->
    <style id="ts-a41-ux">
        /* (3) Don't let a long-press / double-tap select the text of a control or nav
               label — reads as a native app. Content text is untouched. */
        button, .btn, [role="button"], .nav-link, .mobile-nav-item, .sidebar-item,
        .topbar-link, .mobile-more-menu-item, .stat-label, .clear-all-alerts-btn {
            -webkit-user-select: none; -moz-user-select: none; user-select: none;
        }
        /* (4) When a field is focused (mobile focus-scroll) or an in-page anchor is
               jumped to, keep it clear of the sticky top navigation instead of tucking
               it underneath. Inert unless the element is actually scrolled into view. */

            scroll-margin-top: 84px;
        }
        /* (5) Comfortable, honest touch targets on phones. The compact navbar language
               selector is deliberately excluded so it keeps its slim size. */

            select:not(.language-selector):not(#languageSelector) {
                min-height: 44px;
                font-size: 16px; /* also blocks iOS focus-zoom on selects */
            }
            .btn:not(.language-selector) { min-height: 44px; }
        }
        /* (6) Respect an explicit "increase contrast" OS setting. */
        @media (prefers-contrast: more) {
            input, select, textarea, .btn, button {
                border-width: 2px !important;
                border-color: #3D4852 !important;
            }
            a:not(.btn):not(.topbar-link):not(.nav-link) { text-decoration: underline; }
        }
        /* (7) Tactile press feedback for navigation items (A8 covered <button>/.btn only).
               Motion-gated and skips anything carrying its own inline transform. */
        @media (prefers-reduced-motion: no-preference) {
            .mobile-nav-item:not([style*="transform"]):active,
            .sidebar-item:not([style*="transform"]):active,
            .nav-link:not([style*="transform"]):active,
            .mobile-more-menu-item:not([style*="transform"]):active {
                transform: scale(0.97);
            }
            .mobile-nav-item, .sidebar-item, .nav-link, .mobile-more-menu-item {
                transition: transform 0.08s ease;
            }
        }
        /* (8) Brand-tint native form controls (checkboxes/radios/range/progress) instead
               of the default OS blue, on both iOS and Android; plus a slim, on-brand
               scrollbar for Firefox/standard engines (A8's was -webkit- only). */

            accent-color: var(--primary, #6B8BA4);
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(107, 139, 164, 0.40) transparent;

        /* (9) Stop horizontal overscroll chaining (accidental browser back/forward swipe)

        img, video { max-width: 100%; }

    <script id="ts-a41-ux-script">
    (function () {

        // that is ABSENT, so any field that already declares its own is left alone. This
        // complements the A16 enhancer (which set autocapitalize/autocorrect/enterkeyhint

        // heuristics handle those better than a guess would.

            if (!el.hasAttribute('autocomplete')) {
                var token = '';
                if (type === 'email' || /email/.test(key)) token = 'email';
                else if (/user|handle|login/.test(key)) token = 'username';
                else if (type === 'tel' || /phone|tel|mobile/.test(key)) token = 'tel';

                else if (type === 'tel' || /phone|tel|mobile/.test(key)) el.setAttribute('inputmode', 'tel');
