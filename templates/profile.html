            // Apply translations after content is loaded
            window.i18n.applyLanguage();

            window.addEventListener('languageChanged', () => {
                window.i18n.applyLanguage();
            });
        });
    </script>

    <!-- ===================== F50 UX (A51 batch): cross-platform mobile polish — additive, presentation-only =====
         Eight small refinements in the spirit of the design-review finish work, for iPhone/Android/Galaxy and the
         rest. Each is feature-detected or degrades gracefully; nothing changes layout structure, markup or logic.
         Remove this style block to revert. -->
    <style id="ts-f50-ux">
      /* (1) Brand-match native controls (checkboxes, radios, toggles, range, date/time) vs. the OS blue/green. */
      input, select, textarea, button { accent-color: #5A7A93; }
      /* (2) Ragged last lines -> balanced headings and tidy paragraphs (silent no-op where unsupported). */
      h1, h2, h3, .feature-title, .parameter-name { text-wrap: balance; }
      p, li, .feature-desc, .parameter-description { text-wrap: pretty; }
      /* (3) Tactile press feedback on touch for a native-app feel. */
      @media (hover: none) and (pointer: coarse) {
        button:active, .btn:active, a.btn:active, .back-link:active, [role="button"]:active { transform: scale(0.985); }
      }
      /* (4) Respect reduced-motion: stop infinite spin/pulse/rotate and heavy transitions. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
                                 transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
      }
      /* (5) Consistent keyboard / switch focus ring (brand slate) for accessibility. */
      a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible,
      [role="button"]:focus-visible { outline: 3px solid rgba(90,122,147,0.45); outline-offset: 2px; border-radius: 6px; }
      /* (6) Snappier, cleaner taps: no 300ms delay, no grey tap-flash, no accidental selection on controls. */
      a, button, .btn, [role="button"], select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      button, .btn, [role="button"] { -webkit-user-select: none; user-select: none; }
      /* (7) Stop iOS auto-inflating text in landscape; keep fields >=16px so focusing them never zooms. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      @media (max-width: 768px) { input, select, textarea { font-size: 16px; } }
      /* (8) Comfortable >=44px tap targets (Apple HIG / Material) on small controls. */
      @media (max-width: 768px) { .btn, .btn-primary, .btn-secondary, .back-link, .cta-button, .submit-btn, .language-selector { min-height: 44px; } }
    </style>
    <!-- ===================== END F50 UX ===================== -->
</body>
