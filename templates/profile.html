<!DOCTYPE html>
<!-- TheraSocial Profile Version B205 (F6): cache-bust only (script tags had no ?v). -->
<!-- TheraSocial Profile Version Lang -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TheraSocial</title>
</head>
<body>
    <div id="profileContainer"></div>
    <!-- B205 (F6): both had NO ?v token, so browsers could keep serving a stale cached copy
         (static files are cached for a week). Pinned in lockstep with the rest of the app. -->
    <script src="/static/js/i18n.js?v=B205"></script>
    <script src="/static/js/profile.js?v=B205"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply translations after content is loaded
            window.i18n.applyLanguage();

            // Re-apply translations when language changes
            window.addEventListener('languageChanged', () => {
                window.i18n.applyLanguage();
            });
        });
    </script>
</body>
</html>
