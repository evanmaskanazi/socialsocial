<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- A16 (Android): colour the Chrome/Android status & address bar to match the app. -->
    <meta name="theme-color" content="#6B8BA4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: dark)">
    <title>Circles - TheraSocial</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #6B8BA4 0%, #B6A9C9 100%);
            min-height: 100vh;
        }

        /* P305: Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2D3748 0%, #1F2937 100%);
            }
        }

        .dark-mode body, body.dark-mode {
            background: linear-gradient(135deg, #2D3748 0%, #1F2937 100%);
        }

        /* RTL Support */
        [dir="rtl"] {
            direction: rtl;
        }

        [dir="rtl"] .circles-container {
            text-align: right;
        }

        [dir="rtl"] .circle-selector {
            flex-direction: row-reverse;
        }

        /* ================================================================== */
        /* A6-MOBILE: Additive mobile-UX enhancements — no functional changes. */
        /* Presentation-only; supports the viewport-fit=cover meta added above. */
        /* ================================================================== */
        /* (1) Stop iOS from auto-inflating text sizes in landscape. */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        /* (2) Remove grey tap-flash + (3) kill the 300ms tap delay on controls. */
        a, button, [onclick], [role="button"], input, select, textarea {
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            touch-action: manipulation;
        }
        /* (4) Prevent accidental text-selection on buttons (message text stays
              selectable so users can still copy from conversations). */
        button, [role="button"] { -webkit-user-select: none; user-select: none; }
        @media (max-width: 768px) {
            /* (5) Momentum scrolling + (6) no scroll-chaining / pull-to-refresh. */
            html, body {
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
            }
            /* (7) Prevent iOS "zoom on focus": form fields must be >= 16px. */
            input, select, textarea { font-size: 16px; }
            /* (8) Landscape notch: keep content out of the side safe-areas
                  (needed now that viewport-fit=cover is enabled). */
            body {
                padding-left: calc(20px + env(safe-area-inset-left, 0px));
                padding-right: calc(20px + env(safe-area-inset-right, 0px));
            }
            /* (9) Keep toast notifications clear of the notch / status bar. */
            #toastContainer { top: calc(20px + env(safe-area-inset-top, 0px)) !important; }
        }
        /* ===================== END A6-MOBILE ============================== */
    </style>
</head>
<body>
    <!-- G-5: Apply dark mode from localStorage -->
    <script>if(localStorage.getItem('therasocial_dark_mode')==='true')document.body.classList.add('dark-mode');</script>
    <div id="loadingMessage" style="text-align: center; padding: 20px; font-size: 18px; color: white;" data-i18n="circles.loading">Loading circles...</div>
    <div id="circlesContainer" style="opacity: 0; transition: opacity 0.2s;"></div>

    <script src="/static/js/i18n.js?v=B197"></script>

    <!-- MVP-FIX: Notification polyfill for circles.html -->
    <script>
    (function() {
        if (typeof window.showNotification !== 'function') {
            window.showNotification = function(message, type) {
                type = type || 'info';
                let container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;';
                    document.body.appendChild(container);
                }
                const colors = { success: '#9DB8A0', error: '#C17C74', warning: '#D4A574', info: '#6B8BA4' };
                const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
                const toast = document.createElement('div');
                toast.style.cssText = 'padding:16px 24px;border-radius:12px;color:white;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:12px;max-width:350px;background:' + (colors[type] || colors.info);
                // QA FIX (MEDIUM): Use textContent instead of innerHTML for XSS safety
                const iconSpan = document.createElement('span');
                iconSpan.textContent = icons[type] || icons.info;
                const msgSpan = document.createElement('span');
                msgSpan.textContent = message;
                toast.appendChild(iconSpan);
                toast.appendChild(msgSpan);
                container.appendChild(toast);
                setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 5000);
            };
        }
    })();
    </script>

    <script>
        // SINGLE initialization flag to prevent race conditions
        let pageInitialized = false;
        let isUpdatingLanguage = false; // Prevent concurrent language updates

        // Verify authentication before loading
        async function checkAuthentication() {
            try {
                const response = await fetch('/api/auth/session');
                if (response.status === 401) {
                    window.location.href = '/';
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Error checking authentication:', error);
                return false;
            }
        }

        // Monitor DOM for when circles are actually populated
        function waitForCirclesPopulated(maxWaitMs = 3000) {
            return new Promise((resolve) => {
                const startTime = Date.now();

                const checkPopulated = () => {
                    const publicMembers = document.getElementById('publicMembers');
                    const classBMembers = document.getElementById('class_bMembers');
                    const classAMembers = document.getElementById('class_aMembers');

                    const hasRealContent =
                        (publicMembers && (
                            publicMembers.querySelector('.member-item') ||
                            publicMembers.textContent.includes('private')
                        )) ||
                        (classBMembers && (
                            classBMembers.querySelector('.member-item') ||
                            classBMembers.textContent.includes('private')
                        )) ||
                        (classAMembers && (
                            classAMembers.querySelector('.member-item') ||
                            classAMembers.textContent.includes('private')
                        ));

                    if (hasRealContent) {
                        console.log('Circles populated with real data');
                        resolve(true);
                        return;
                    }

                    if (Date.now() - startTime > maxWaitMs) {
                        console.warn('Timeout waiting for circles to populate');
                        resolve(false);
                        return;
                    }

                    setTimeout(checkPopulated, 50);
                };

                checkPopulated();
            });
        }

        // MAIN INITIALIZATION - runs exactly once
        async function initializeCirclesPage() {
            if (pageInitialized) {
                console.log('Page already initialized, skipping...');
                return;
            }
            pageInitialized = true;

            console.log('Circles page initializing...');

            // 1. Check authentication first
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) return;

            // 2. Wait for i18n to load
            let waitCount = 0;
            while ((!window.i18n || !window.i18n.translations) && waitCount < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                waitCount++;
            }

            // 3. Add circle translations if available
            if (typeof addCircleTranslations === 'function') {
                addCircleTranslations();
            }

            // 4. Load HTML structure (invisible)
            if (typeof circlesHTML !== 'undefined') {
                document.getElementById('circlesContainer').innerHTML = circlesHTML;
                console.log('Circles HTML loaded');
            } else {
                console.error('circlesHTML not found');
                return;
            }

         // 5. Apply user's language preference from localStorage
// Note: We only read from localStorage to avoid race conditions with the main dashboard
// The main dashboard handles syncing language with the backend
try {
    const localLang = localStorage.getItem('selectedLanguage');
    console.log('[Circles] Using localStorage language (no backend sync):', localLang);

    const langToUse = localLang || 'en';

    if (window.i18n && window.i18n.setLanguage) {
        await window.i18n.setLanguage(langToUse);
        console.log('[Circles] Language set to:', langToUse);
    }
} catch (error) {
    console.log('[Circles] Error setting language:', error);
}

            // 6. Apply initial translations
            if (window.i18n && window.i18n.applyLanguage) {
                const currentLang = window.i18n.getCurrentLanguage ? window.i18n.getCurrentLanguage() : 'en';
                window.i18n.applyLanguage(currentLang);

                // Set RTL direction
                const rtlLanguages = ['ar', 'he'];
                document.body.setAttribute('dir', rtlLanguages.includes(currentLang) ? 'rtl' : 'ltr');
            }

            // 7. Initialize circles data
            if (typeof initializeCircles === 'function') {
                console.log('Calling initializeCircles');
                initializeCircles();
            } else if (typeof loadCircles === 'function') {
                console.log('Calling loadCircles');
                loadCircles();
            } else {
                console.error('No circle initialization function found');
                return;
            }

            // 8. Wait for circles to populate
            console.log('Waiting for circles to populate...');
            await waitForCirclesPopulated(3000);

            // 9. Apply translations (after data loaded)
            if (window.i18n && window.i18n.applyLanguage) {
                const currentLang = window.i18n.getCurrentLanguage ? window.i18n.getCurrentLanguage() : 'en';
                window.i18n.applyLanguage(currentLang);
            }

            // 10. Update circle displays (member lists)
            if (typeof updateCirclesDisplay === 'function') {
                updateCirclesDisplay();
            }

            // 11. Update privacy dropdown translations
            if (typeof updatePrivacyDropdownTranslations === 'function') {
                updatePrivacyDropdownTranslations();
            }

            // 12. Force-update circle titles as FINAL step (with delay to ensure all other translations complete)
            // This fixes the race condition where applyLanguage() was overwriting manual title updates
            if (typeof updateCircleTitles === 'function') {
                setTimeout(() => {
                    updateCircleTitles();
                    console.log('[Circles] Final circle titles update complete');
                }, 100);
            }

            // 12.5. Load circle recommendations (explicit call as backup)
            if (typeof loadCircleRecommendations === 'function') {
                setTimeout(() => {
                    console.log('[Circles] Explicitly calling loadCircleRecommendations');
                    loadCircleRecommendations();
                }, 200);
            }

            // PJN452: Add action buttons when viewing another user's circles
            const urlParams = new URLSearchParams(window.location.search);
            const viewingUserId = urlParams.get('user_id');
            if (viewingUserId) {
                console.log('[Circles] Viewing another user circles, adding action buttons');
                await addCirclesActionButtons(parseInt(viewingUserId));
            }

            // 13. Make visible
            const container = document.getElementById('circlesContainer');
            const loadingDiv = document.getElementById('loadingMessage');
            container.style.opacity = '1';
            if (loadingDiv) loadingDiv.style.display = 'none';

            console.log('Circles page fully initialized and visible');
        }

        // PJN452: Add action buttons to circles page when viewing another user
        // PJ501: Added block check before displaying user profile
        async function addCirclesActionButtons(userId) {
            try {
                // PJ501: Check if blocked by this user first
                try {
                    const blockCheckResponse = await fetch(`/api/users/${userId}/check-blocked`, { credentials: 'include' });
                    if (blockCheckResponse.ok) {
                        const blockStatus = await blockCheckResponse.json();
                        if (blockStatus.blockedBy || blockStatus.is_blocked) {
                            // Show Account Not Available message and redirect
                            const lang = localStorage.getItem('selectedLanguage') || 'en';
                            const accountMsg = (window.i18n && window.i18n.translate) ? window.i18n.translate('msg.account_not_available') : 'Account Not Available';
                            // MVP-FIX: Use toast instead of alert()
                            if (typeof showNotification === 'function') {
                                showNotification(accountMsg, 'error');
                            } else {
                                console.warn(accountMsg);
                            }
                            setTimeout(() => { window.location.href = '/?view=following'; }, 1500);
                            return;
                        }
                    }
                } catch (e) {
                    console.error('Error checking block status:', e);
                }
                
                // Get user profile info
                const profileResponse = await fetch(`/api/users/${userId}/profile`, { credentials: 'include' });
                if (!profileResponse.ok) {
                    // PJ501: Check if blocked (403 with blocked error)
                    if (profileResponse.status === 403) {
                        const errorData = await profileResponse.json().catch(() => ({}));
                        if (errorData.blocked || errorData.error === 'account_not_available') {
                            const lang = localStorage.getItem('selectedLanguage') || 'en';
                            const accountMsg = (window.i18n && window.i18n.translate) ? window.i18n.translate('msg.account_not_available') : 'Account Not Available';
                            // MVP-FIX: Use toast instead of alert()
                            if (typeof showNotification === 'function') {
                                showNotification(accountMsg, 'error');
                            } else {
                                console.warn(accountMsg);
                            }
                            setTimeout(() => { window.location.href = '/?view=following'; }, 1500);
                            return;
                        }
                    }
                    return;
                }
                const userData = await profileResponse.json();
                const username = userData.username || 'User';
                
                // Check if following
                let isFollowing = false;
                try {
                    const followingResponse = await fetch('/api/following', { credentials: 'include' });
                    if (followingResponse.ok) {
                        const followingData = await followingResponse.json();
                        // A21 (dormant-bug fix): coerce both sides (userId is parseInt'd above).
                        // Matches the robust Number() comparison used for the circle check below;
                        // a string id from the API would otherwise make an already-followed user
                        // show "Follow" instead of "Unfollow".
                        isFollowing = followingData.following.some(u => Number(u.id) === userId);
                    }
                } catch (e) {
                    console.error('Error checking following status:', e);
                }
                
                // Translation labels
                const tt = (key, fallback) => (window.i18n && window.i18n.translate) ? (window.i18n.translate(key) || fallback) : fallback;
                const t = {
                    back: tt('common.back_to_following', '← Back to Following'),
                    follow: tt('btn.follow', 'Follow'),
                    unfollow: tt('btn.unfollow', 'Unfollow'),
                    addToCircle: tt('circles.add_to_circle', 'Add to Circle'),
                    block: tt('btn.block', 'Block'),
                    unblock: tt('btn.unblock', 'Unblock')
                };
                
                // PJ601: Check if user is blocked
                let isBlocked = false;
                try {
                    const blockedResponse = await fetch('/api/blocked-users', { credentials: 'include' });
                    if (blockedResponse.ok) {
                        const blockedData = await blockedResponse.json();
                        if (blockedData.blocked_users) {
                            isBlocked = blockedData.blocked_users.some(u => Number(u.id) === userId);  // A21: coerce ids (see isFollowing)
                        }
                    }
                } catch (e) {
                    console.error('Error checking blocked status:', e);
                }
                
                // PJ702: Check if user is already in any of my circles (improved)
                let isInCircles = false;
                try {
                    // Fetch MY circles (without user_id param) to check if viewed user is in them
                    const circlesResponse = await fetch('/api/circles', { credentials: 'include' });
                    if (circlesResponse.ok) {
                        const circlesData = await circlesResponse.json();
                        console.log('[PJ702] My circles data:', circlesData);
                        console.log('[PJ702] Checking if userId', userId, 'is in my circles');
                        
                        // Check all circle types: general/public, close_friends/class_b, family/class_a
                        const publicCircle = circlesData.general || circlesData.public || [];
                        const classBCircle = circlesData.close_friends || circlesData.class_b || [];
                        const classACircle = circlesData.family || circlesData.class_a || [];
                        
                        const allCircleMembers = [...publicCircle, ...classBCircle, ...classACircle];
                        console.log('[PJ702] All circle members:', allCircleMembers.map(m => ({id: m.id, username: m.username})));
                        
                        // Use Number() for robust comparison in case of type mismatch
                        isInCircles = allCircleMembers.some(m => Number(m.id) === Number(userId));
                        console.log('[PJ702] isInCircles result:', isInCircles);
                    }
                } catch (e) {
                    console.error('Error checking circles:', e);
                }
                
                // Create container for buttons
                const container = document.getElementById('circlesContainer');
                if (!container) return;
                
                // Create back button
                const backBtn = document.createElement('button');
                backBtn.className = 'btn-secondary back-to-following-btn';
                backBtn.textContent = t.back;
                backBtn.style.cssText = 'margin-bottom: 1rem; display: block;';
                backBtn.onclick = () => {
                    window.location.href = '/?view=following';
                };
                
                // Create action buttons container
                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'profile-action-buttons';
                buttonContainer.style.cssText = 'display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; padding: 0.5rem; background: #f8f9fa; border-radius: 8px;';
                
                if (isFollowing) {
                    const unfollowBtn = document.createElement('button');
                    unfollowBtn.className = 'btn-secondary';
                    unfollowBtn.textContent = t.unfollow;
                    unfollowBtn.style.cssText = 'padding: 0.5rem 1rem;';
                    unfollowBtn.onclick = async () => {
                        if (confirm(tt('msg.confirm_unfollow', 'Are you sure you want to unfollow this user?'))) {
                            const response = await fetch(`/api/unfollow/${userId}`, { method: 'DELETE', credentials: 'include' });
                            if (response.ok) {
                                window.location.reload();
                            }
                        }
                    };
                    buttonContainer.appendChild(unfollowBtn);
                } else {
                    // PJ601: Block/Unblock button with toggle
                    const blockBtn = document.createElement('button');
                    blockBtn.textContent = isBlocked ? t.unblock : t.block;
                    blockBtn.style.cssText = isBlocked 
                        ? 'padding: 0.5rem 1rem; background-color: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer;'
                        : 'padding: 0.5rem 1rem; background-color: #C17C74; color: white; border: none; border-radius: 6px; cursor: pointer;';
                    blockBtn.onclick = async () => {
                        if (isBlocked) {
                            // Unblock user
                            const response = await fetch(`/api/users/${userId}/unblock`, { method: 'POST', credentials: 'include' });
                            if (response.ok) {
                                window.location.reload();
                            }
                        } else {
                            // Block user
                            if (confirm(tt('msg.confirm_block', 'Block this user?'))) {
                                const response = await fetch(`/api/users/${userId}/block`, { method: 'POST', credentials: 'include' });
                                if (response.ok) {
                                    window.location.href = '/?view=following';
                                }
                            }
                        }
                    };
                    buttonContainer.appendChild(blockBtn);
                    
                    // Follow button with min-width to match Follow with Note
                    const followBtn = document.createElement('button');
                    followBtn.className = 'btn-primary';
                    followBtn.textContent = t.follow;
                    followBtn.style.cssText = 'padding: 0.5rem 1rem; background-color: #6B8BA4; color: white; width: auto;';
                    followBtn.onclick = async () => {
                        const response = await fetch(`/api/follow/${userId}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ note: '' })
                        });
                        if (response.ok) {
                            window.location.reload();
                        }
                    };

                else if (type === 'tel' || /phone|tel|mobile/.test(key)) el.setAttribute('inputmode', 'tel');
            }
        };
        var scan = function (root) {
            try {
                var ins = (root || document).getElementsByTagName('input');
                for (var i = 0; i < ins.length; i++) enhance(ins[i]);
            } catch (_) {}
        };
        onReady(function () {
            scan(document);
            if ('MutationObserver' in window) {
                new MutationObserver(function (muts) {
                    for (var i = 0; i < muts.length; i++)
                        for (var j = 0; j < muts[i].addedNodes.length; j++) {
                            var n = muts[i].addedNodes[j];
                            if (n.nodeType !== 1) continue;
                            if (n.tagName === 'INPUT') enhance(n);
                            else if (n.getElementsByTagName) scan(n);
                        }
                }).observe(document.body, { childList: true, subtree: true });
            }
        });
    })();
    </script>
    <!-- ===================== END A41-UX ===================== -->
    <!-- ============================================================================ -->
    <!-- A51-UX: 10 additive, presentation-only layout/readability improvements (B196). -->
    <!-- Self-contained single style block, namespaced ts-a51-ux. No markup, IDs or JS -->
    <!-- changed. Chosen to NOT overlap the existing A6/A8/A16/A41 blocks. Desktop+mobile.-->
    <!--  1 Long emails/URLs/handles never force horizontal overflow (word wrapping)      -->
    <!--  2 Images/video keep their aspect ratio (height:auto + the existing max-width)   -->
    <!--  3 Wide tables / code scroll inside their own box, never the whole page          -->
    <!--  4 Brand-tinted text selection highlight (light + dark)                          -->
    <!--  5 Clear, consistent "disabled" affordance on controls                           -->
    <!--  6 More legible placeholder text for accessibility/contrast (light + dark)       -->
    <!--  7 tel: / WhatsApp links never wrap awkwardly mid-number                         -->
    <!--  8 Mobile: form controls, media & tables can never exceed the viewport width     -->
    <!--  9 Mobile: guard against accidental sideways page scroll                         -->
    <!-- 10 Mobile: comfortable tap spacing for stacked inline links (e.g. contact links) -->
    <!-- ============================================================================ -->
    <style id="ts-a51-ux">
        /* (1) Never let a long unbreakable string (an email address, URL, or @handle)
               push the layout wider than the screen. */
        p, li, td, th, dd, blockquote,
        .contact-info, .faq-answer, .message-text, .bio, .user-bio {
            overflow-wrap: break-word;
            word-break: break-word;
        }
        a { overflow-wrap: break-word; }
        /* (2) Keep media in proportion when width is constrained (pairs with the existing
               max-width:100% rules so images are never vertically squashed). */
        img, svg, video { height: auto; }
        /* (3) Wide tables / preformatted blocks scroll within themselves instead of
               stretching the page sideways. */
        pre { max-width: 100%; overflow-x: auto; }
        table { max-width: 100%; }
        /* (4) On-brand text selection (both themes). */
        ::selection { background: rgba(107, 139, 164, 0.28); }
        .dark-mode ::selection, body.dark-mode ::selection { background: rgba(150, 170, 200, 0.40); }
        /* (5) Consistent, honest disabled state. */
        button:disabled, input:disabled, select:disabled, textarea:disabled,
        .btn:disabled, [aria-disabled="true"] {
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* (6) Placeholder text that meets contrast guidance (was often too faint). */
        ::placeholder { color: #7A8798; opacity: 1; }
        .dark-mode ::placeholder, body.dark-mode ::placeholder { color: #9AA6B8; }
        /* (7) Phone / WhatsApp links stay on one line. */
        a[href^="tel:"], a[href*="wa.me"] { white-space: nowrap; }
        @media (max-width: 768px) {
            /* (8) Hard guarantee that nothing overflows the viewport on phones. */
            input, select, textarea, table, pre, img, video { max-width: 100% !important; }
            /* (9) Belt-and-braces guard against sideways page scroll (safe on the body element:
                   it propagates to the viewport without creating an inner scroll container). */
            body { overflow-x: hidden; }
            /* (10) Give stacked inline links (e.g. the three contact emails) a comfortable
                    vertical tap area without changing the layout structure. */
            .contact-info a, li > a { padding-top: 2px; padding-bottom: 2px; }
        }
    </style>
    <!-- ===================== END A51-UX ===================== -->
